name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: ./scripts/verify.sh

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-site
        with:
          stage: staging
          client-id: ${{ secrets.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          post-store-account: ${{ vars.POST_STORE_ACCOUNT }}
