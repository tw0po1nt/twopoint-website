name: Build the site
description: >-
  Pulls the posts from the post store, then builds the widgets and the F# site for one
  stage. The job needs the id-token: write permission. The site goes to
  frontend/dist/website/, the newsletters to frontend/dist/newsletter/, and the stage
  marker to frontend/dist/stage.

inputs:
  stage:
    description: "The stage of the build: local, staging, or production."
    required: true
  client-id:
    description: "The client ID of the build identity, which can read the post store."
    required: true
  tenant-id:
    description: "The Azure tenant ID."
    required: true
  post-store-account:
    description: "The storage account name of the post store."
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - uses: actions/setup-node@v4
      with:
        node-version-file: frontend/Widgets/.node-version
        cache: npm
        cache-dependency-path: frontend/Widgets/package-lock.json

    - name: Restore the .NET tools
      shell: bash
      run: dotnet tool restore

    - name: Install the widget packages
      shell: bash
      working-directory: frontend/Widgets
      run: npm ci

    - name: Build the widgets
      shell: bash
      working-directory: frontend/Widgets
      run: npm run build

    - name: Test the widget bundles
      shell: bash
      working-directory: frontend/Widgets
      run: npm test

    - name: Sign in to Azure as the build identity
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        # The build identity has roles on two containers only, so it can see no subscription.
        allow-no-subscriptions: true

    - name: Pull the posts from the post store
      shell: bash
      env:
        ACCOUNT: ${{ inputs.post-store-account }}
      run: dotnet run --project frontend/Generator -- pull --account "$ACCOUNT"

    - name: Build the site
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
      run: dotnet run --project frontend/Generator -- build --stage "$STAGE"
